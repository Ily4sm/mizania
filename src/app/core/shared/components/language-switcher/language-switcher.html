<div class="language-switcher" [class.open]="isOpen()">
  <button
    type="button"
    class="language-trigger"
    (click)="toggle()"
    aria-label="Change language"
  >
    <img class="flag" [src]="selectedOption.flagUrl" [alt]="selectedOption.label" />
    <span class="language-code">{{ selectedOption.label }}</span>

    <lucide-icon
      class="chevron"
      [img]="icons.chevron"
      size="15"
      strokeWidth="2.5"
    ></lucide-icon>
  </button>

  @if (isOpen()) {
    <div class="language-panel">
      @for (option of options; track option.value) {
        <button
          type="button"
          class="language-option"
          [class.active]="option.value === selectedOption.value"
          (click)="changeLanguage(option.value)"
        >
          <img class="flag" [src]="option.flagUrl" [alt]="option.label" />
          <span>{{ option.label }}</span>
        </button>
      }
    </div>
  }
</div>
