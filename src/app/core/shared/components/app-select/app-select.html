<div class="select-root" [class.open]="isOpen()" [class.disabled]="disabled()">
  <button type="button" class="select-trigger" (click)="toggle()">
    <span>{{ selectedLabel }}</span>

    <lucide-icon
      [img]="icons.chevron"
      size="17"
      strokeWidth="2.4"
      class="chevron"
    ></lucide-icon>
  </button>

  @if (isOpen()) {
    <div class="select-panel">
      @for (option of options; track option.value) {
        <button
          type="button"
          class="select-option"
          [class.selected]="option.value === value()"
          (click)="selectOption(option)"
        >
          {{ option.label }}
        </button>
      }
    </div>
  }
</div>
