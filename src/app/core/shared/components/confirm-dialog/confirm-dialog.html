@if (confirmService.state(); as dialog) {
  <div class="confirm-backdrop" (click)="cancel()">
    <article class="confirm-modal" (click)="$event.stopPropagation()">
      <div class="icon-wrap" [class.danger]="dialog.danger">
        @if (dialog.danger) {
          !
        } @else {
          ?
        }
      </div>

      <div class="confirm-content">
        <h2>{{ dialog.title }}</h2>
        <p>{{ dialog.message }}</p>
      </div>

      <div class="confirm-actions">
        <button type="button" class="ghost-btn" (click)="cancel()">
          {{ dialog.cancelText }}
        </button>

        <button
          type="button"
          class="confirm-btn"
          [class.danger]="dialog.danger"
          (click)="accept()"
        >
          {{ dialog.confirmText }}
        </button>
      </div>
    </article>
  </div>
}
