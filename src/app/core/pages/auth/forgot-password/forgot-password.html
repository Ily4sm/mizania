<section class="auth-page">
  <div class="auth-card card">
    <div class="auth-icon">
      <lucide-icon [img]="icons.mailQuestion" size="28" strokeWidth="2.4"></lucide-icon>
    </div>

    <div class="auth-heading">
      <p class="eyebrow">{{ 'APP.NAME' | translate }}</p>
      <h1 class="page-title">{{ 'AUTH.FORGOT_TITLE' | translate }}</h1>
      <p class="page-subtitle">{{ 'AUTH.FORGOT_SUBTITLE' | translate }}</p>
    </div>

    <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
      <label class="field">
        <span>{{ 'AUTH.EMAIL' | translate }}</span>
        <input class="input" type="email" formControlName="email" autocomplete="email" />
      </label>

      <button class="btn btn-primary submit-btn" type="submit" [disabled]="loading()">
        @if (loading()) {
          {{ 'COMMON.LOADING' | translate }}
        } @else {
          {{ 'AUTH.SEND_RESET_LINK' | translate }}
        }
      </button>
    </form>

    <a class="back-link" routerLink="/auth/login">
      <lucide-icon [img]="icons.back" size="17"></lucide-icon>
      {{ 'AUTH.BACK_TO_LOGIN' | translate }}
    </a>
  </div>
</section>
