<section class="auth-page">
  <div class="auth-card card">
    <div class="auth-icon">
      <lucide-icon [img]="icons.login" size="28" strokeWidth="2.4"></lucide-icon>
    </div>

    <div class="auth-heading">
      <p class="eyebrow">{{ 'APP.NAME' | translate }}</p>
      <h1 class="page-title">{{ 'AUTH.LOGIN_TITLE' | translate }}</h1>
      <p class="page-subtitle">{{ 'AUTH.LOGIN_SUBTITLE' | translate }}</p>
    </div>

    <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
      <label class="field">
        <span>{{ 'AUTH.EMAIL' | translate }}</span>

        <div class="input-wrap">
          <lucide-icon [img]="icons.mail" size="18"></lucide-icon>
          <input class="input" type="email" formControlName="email" autocomplete="email" />
        </div>
      </label>

      <label class="field">
        <span>{{ 'AUTH.PASSWORD' | translate }}</span>

        <div class="input-wrap">
          <lucide-icon [img]="icons.lock" size="18"></lucide-icon>

          <input
            class="input"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            autocomplete="current-password"
          />

          <button
            class="icon-btn"
            type="button"
            (click)="togglePassword()"
            [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
          >
            @if (showPassword()) {
              <lucide-icon [img]="icons.eyeOff" size="18"></lucide-icon>
            } @else {
              <lucide-icon [img]="icons.eye" size="18"></lucide-icon>
            }
          </button>
        </div>
      </label>

      <a class="forgot-link" routerLink="/auth/forgot-password">
        {{ 'AUTH.FORGOT_PASSWORD_LINK' | translate }}
      </a>

      <button class="btn btn-primary submit-btn" type="submit" [disabled]="loading()">
        @if (loading()) {
          {{ 'COMMON.LOADING' | translate }}
        } @else {
          {{ 'ACTIONS.LOGIN' | translate }}
        }
      </button>
    </form>

    <p class="auth-link">
      {{ 'AUTH.NO_ACCOUNT' | translate }}
      <a routerLink="/auth/register">{{ 'AUTH.CREATE_ONE' | translate }}</a>
    </p>
  </div>
</section>
